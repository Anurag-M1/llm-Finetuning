services:
  - type: web
    name: llm-finetuning-ui
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements-ui.txt
    startCommand: streamlit run chat_ui.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
